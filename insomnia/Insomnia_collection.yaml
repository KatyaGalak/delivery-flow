              modified: 1788720837572
              isPrivate: false
              description: ""
              sortKey: -1788709778659
            method: POST
            body:
              mimeType: application/json
              text: |-
                {
                  "username": "{{ registerUsername }}",
                  "password": "{{ _.password }}",
                  "name": "Ekaterina",
                  "email": "ekaterina-first@mail.ru",
                  "role": "ROLE_CUSTOMER"
                }
            headers:
              - name: Content-Type
                value: application/json
            scripts:
              preRequest: >-
                const registerUsername =
                `user_${Date.now()}_${Math.floor(Math.random() * 10000)}`;

                insomnia.environment.set('registerUsername', registerUsername);

                insomnia.environment.set('username', registerUsername);


                const registerPassword = `pass_${Math.floor(Math.random() *
                1000000)}`;

                insomnia.environment.set('password', registerPassword);
              afterResponse: >-
                insomnia.test('Статус код должен быть 201 (Created)', () => {
                  insomnia.expect(insomnia.response.code).to.equal(201);
                });


                if (insomnia.response.body) {
                  const responseBody = JSON.parse(insomnia.response.body);

                  insomnia.test('Пользователь создан: есть id и username', () => {
                    insomnia.expect(responseBody.id).to.be.a('number');
                    insomnia.expect(responseBody.username).to.be.a('string');
                    insomnia.expect(responseBody.roles).to.be.an('array');
                  });
                	
                	if (insomnia.response.text().username) {
                    insomnia.environment.set('username', insomnia.response.text().username);
                  }

                	
                } else {
                  insomnia.test('Тело ответа пустое', () => {
                    insomnia.expect.fail('Response body отсутствует');
                  });
                }
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: global
              cookies:
                send: true
                store: true
              rebuildPath: true

        children:
          - url: "{{ _.base_url }}/api/orders"
            name: Positive - Create order
            meta:
              id: req_8f51151dcfe943aca0d32fbd827b4aed
              created: 1788692641894
              modified: 1788720172445
              isPrivate: false
              description: ""
              sortKey: -1788692641894
            method: POST
            body:
              mimeType: application/json
              text: |-
                {
                  "restaurantId": 1111,
                  "deliveryAddress": "Lenina 1022, Moscow",
                  "items": [
                    {
                      "menuItemId": 111,
                      "name": "хлеб",
                      "quantity": 5,
                      "price": 50.0
                    }
                  ]
                }
            headers:
              - name: Content-Type
                value: application/json
              - name: Authorization
                value: Bearer {{ _.token }}
                description: ""
                disabled: false
            scripts:
              afterResponse: >-
                insomnia.test('Статус код должен быть 201 (Created)', () => {
                  insomnia.expect(insomnia.response.code).to.equal(201);
                });


                if (insomnia.response.body) {
                  const responseBody = JSON.parse(insomnia.response.body);
                  const orderId = responseBody.orderId || responseBody.id;

                  insomnia.test('Заказ создан: есть id', () => {
                    insomnia.expect(orderId).to.not.be.undefined;
                    insomnia.expect(orderId).to.not.be.null;
                  });

                  insomnia.test('У заказа есть статус', () => {
                    insomnia.expect(responseBody.status).to.be.a('string');
                  });

                  if (orderId) {
                    insomnia.environment.set('orderId', String(orderId));
                  }

                  const token = insomnia.environment.get('token');
                  const baseUrl = insomnia.environment.get('base_url');

                  if (orderId && token) {
                    insomnia.sendRequest({
                      url: `${baseUrl}/api/orders/${orderId}`,
                      method: 'GET',
                      headers: {
                        Authorization: `Bearer ${token}`
                      }
                    }, function (err, ans) {
                      insomnia.test('GET order by id должен вернуть 200', () => {
                        insomnia.expect(ans.code).to.equal(200);
                      });

                      if (ans && ans.body) {
                        const orderResponse = JSON.parse(ans.body);
                        const gotId = orderResponse.orderId || orderResponse.id;

                        insomnia.test('GET order возвращает тот же id', () => {
                          insomnia.expect(String(gotId)).to.equal(String(orderId));
                        });
                      }
                    });
                  }
                } else {
                  insomnia.test('Тело ответа пустое', () => {
                    insomnia.expect.fail('Response body отсутствует');
                  });
                }
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: global
              cookies:
                send: true
                store: true
              rebuildPath: true
